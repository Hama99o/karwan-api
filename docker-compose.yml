# =============================================================================
# THE DEV RIG — bring the whole thing up with: docker compose up -d
#
# `docker compose ps` is the honest answer to "is the API up?", which is the
# point of this file. On 2026-09-19 nobody could say whether the API was
# running, and the mobile session photographed merchant cards with no logos,
# because starting it was a sentence in a comment that somebody had to read and
# retype correctly.
#
# Ports are offset to avoid every other project on this box:
#   5432 booklet · 5443 multi_magic · 5456 studio · 5407 hatiwal · 5417 us
#   3017 is OUR API. The rig, every doc and the emulator all depend on it.
# For production deployment, use Kamal: kamal deploy
#
# `docker compose down` is safe — the database lives in the NAMED VOLUME below
# and survives it. `docker compose down -v` is NOT: the -v destroys that volume
# and with it every seeded merchant, every opening hour and every Active
# Storage blob the QA photo pass shoots. Re-seeding is not a one-minute job.
# There is no flag that makes it reversible; take the volume, not the -v.
#
# RUNNING NATIVELY STILL WORKS AND IS NOT DEPRECATED. `bin/rails s` on the host
# (3017 is the default — do not pass -p) is still the right tool for a debugger
# breakpoint, and it is faster to restart. Use whichever you like, but not both
# at once: they want the same port. `docker compose ps` tells you which is up.
#
# WHAT IS DELIBERATELY ABSENT:
#   redis / sidekiq — this app has none. Gemfile: "Solid adapters (cache,
#     queue, cable) — all Postgres-backed, so no Redis in v0". Adding them
#     would be adding a dependency the app does not have.
#   osrm — defined below but PROFILED OFF, because its ~512 MB dataset is not
#     on this machine. See the service for what it needs.
# =============================================================================

services:
  postgres:
    image: "postgres:16"
    restart: unless-stopped
    environment:
      - "POSTGRES_PASSWORD=password"
      - "POSTGRES_DB=karwan_development"
      - "POSTGRES_USER=karwan"
    volumes:
      - "postgres:/var/lib/postgresql/data"
    ports:
      - "5417:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karwan -d karwan_development"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      # NOT the default target. The default is the production image Kamal
      # ships; `development` is a separate stage in the same Dockerfile.
      target: development
    restart: unless-stopped
    # CLEARS A STALE PID FIRST, and this is not defensive dressing: the source
    # tree is bind-mounted, so a `tmp/pids/server.pid` left behind by a NATIVE
    # `bin/rails s` — killed, crashed, or simply still running when you
    # switched — is visible inside the container. Puma reads it, concludes a
    # server is already up, and refuses to boot citing a pid that does not
    # exist in this namespace. The host and the container disagree about what
    # a pid means; the pidfile is the one piece of state that crosses between
    # them. There is one on this box right now, from the 09:08 native server.
    command: >
      bash -c "rm -f tmp/pids/server.pid &&
               ./bin/rails server -b 0.0.0.0 -p 3017"
    # RUNS AS THE HOST USER, not the image's uid 1000. The source tree is
    # bind-mounted, so anything the app writes — log/, tmp/, and storage/,
    # which holds the seeded merchant photos — lands on the host owned by
    # whoever the container is. A mismatch here is how a container silently
    # stops being able to write its own Active Storage blobs.
    user: "${DOCKER_UID:-1001}:${DOCKER_GID:-1001}"
    environment:
      RAILS_ENV: development
      # `postgres:5432`, not `localhost:5417` — inside the compose network the
      # service name resolves and the published port is irrelevant. The
      # published 5417 is for the HOST (a native `bin/rails s`, psql, the test
      # suite), and both are correct at the same time.
      DATABASE_URL: "postgres://karwan:password@postgres:5432/karwan_development"
      # BAKED IN, which is the point. 10.0.2.2 is the Android emulator's alias
      # for the host loopback, and this value is what puts a reachable host in
      # every Active Storage URL the app hands the app. Left to be remembered
      # on the command line, it was forgotten, and the merchant cards came up
      # blank. A handset on the LAN needs the machine's LAN address here
      # instead; the emulator does not.
      APP_BASE_URL: "http://10.0.2.2:3017"
    ports:
      - "3017:3017"
    volumes:
      # The code is mounted, not copied, so an edit is live without a rebuild.
      # Gems live at /usr/local/bundle, outside /rails, so this mount does not
      # shadow them.
      - ".:/rails"
    depends_on:
      postgres:
        condition: service_healthy

  # ── THE ROUTER, DEFINED BUT NOT STARTED ───────────────────────────────────
  #
  # `profiles` keeps this OUT of a plain `docker compose up`. That is not
  # timidity: THE DATA IS NOT IN THE IMAGE and it is not on this machine.
  # `config/deploy.yml` says the serving set is a ~512 MB `.osrm.*` build made
  # on the host, and /var/karwan/osrm does not exist here. Starting this
  # service without it gives a container that boots, fails to mmap a dataset
  # and exits — a red herring in `docker compose ps` for everyone after you.
  #
  # Routing is ALSO off by a second, independent switch: the `routing_distance_source`
  # setting. Until it says `osrm`, `Routing::DistanceResolver` takes the straight
  # line and says so. "A router is reachable" and "we price on roads" are two
  # separate facts on purpose.
  #
  # TO USE IT: build the dataset per docs/RUNBOOK.md into /var/karwan/osrm,
  # then `docker compose --profile routing up -d` and set OSRM_BASE_URL on web
  # to http://osrm:5000.
  osrm:
    profiles: ["routing"]
    image: "ghcr.io/project-osrm/osrm-backend:latest"
    restart: unless-stopped
    command: osrm-routed --algorithm ch --mmap=1 /data/afghanistan.osrm
    volumes:
      # Read-only: a router that can write to its own dataset is a router that
      # can corrupt it.
      - "/var/karwan/osrm:/data:ro"
    ports:
      - "5000:5000"

volumes:
  postgres:

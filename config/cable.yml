development:
  adapter: async

test:
  adapter: test

# Postgres-backed, not Redis — see the note in docker-compose.yml. The `cable`
# database is declared in config/database.yml's production block.
production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
